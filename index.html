<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pick a restaurant for lunch or dinner.">
<title>Where should I order?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light;--ink:#3b2820;--muted:#745b4e;--orange:#bd3c22;--line:#ecd5c3;--paper:#fff9ef}
*{box-sizing:border-box}body{margin:0;background:#fff3df;color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #87501e;outline-offset:4px}
.shell{width:min(100% - 40px,1040px);margin:auto}.top{display:flex;align-items:center;gap:10px;padding:30px 0;font-weight:800;font-size:.86rem;letter-spacing:.06em}.mark{display:grid;place-items:center;background:#ffd8bb;border-radius:12px;width:38px;height:38px;font-size:1.15rem}
main{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:620px;padding:25px 0 65px}.intro{padding:12px 0}.overline{margin:0 0 16px;color:#9b3e24;font-weight:800;font-size:.77rem;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2.8rem,5.9vw,5rem);letter-spacing:-.085em;line-height:1.11;margin:0;font-weight:800}h1 span{color:var(--orange);display:block}.lead{color:var(--muted);line-height:1.75;margin:21px 0 32px;max-width:350px}.meal-label{font-weight:700;font-size:.9rem;margin:0 0 12px}.meals{display:flex;gap:8px;flex-wrap:wrap}.meal{border:1px solid var(--line);background:var(--paper);padding:11px 13px;border-radius:14px;font-size:.84rem;font-weight:700}.meal[aria-pressed=true]{background:#ffddc7;border-color:#db886d;color:#822f1b}.meal:hover{border-color:#a3543c}
.card{position:relative;background:var(--paper);padding:14px;border:1px solid var(--line);border-radius:32px;box-shadow:0 14px 35px #8e4c2520}.art{min-height:285px;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:22px;background-color:#ffd99c;background-image:linear-gradient(45deg,#fff5d367 25%,transparent 25%,transparent 75%,#fff5d367 75%),linear-gradient(45deg,#fff5d367 25%,transparent 25%,transparent 75%,#fff5d367 75%);background-position:0 0,18px 18px;background-size:36px 36px}.plate{display:grid;place-items:center;width:198px;aspect-ratio:1;border-radius:50%;background:#fff9ea;border:8px solid #fffdf7;box-shadow:0 13px 0 #a35c2c33,inset 0 0 0 4px #f4dabc;transform:rotate(-9deg)}.food{font-size:6.4rem;line-height:1;filter:drop-shadow(0 5px 3px #65351c30)}.spark{position:absolute;color:#9d451d;font-size:1.8rem}.one{top:18%;left:17%}.two{right:16%;bottom:16%;font-size:2.2rem}.three{right:19%;top:20%;font-size:1.2rem}
.content{padding:20px 11px 10px}.tag{font-size:.74rem;font-weight:800;color:#943a22;text-transform:uppercase;letter-spacing:.09em;margin:0 0 8px}h2{font-size:clamp(1.65rem,3.5vw,2.3rem);line-height:1.2;letter-spacing:-.05em;margin:0;overflow-wrap:anywhere}.desc{color:var(--muted);font-size:.92rem;line-height:1.55;margin:10px 0 19px;min-height:2.9em}.draw{border:0;background:var(--orange);color:white;width:100%;padding:15px 10px;border-radius:15px;font-weight:800;box-shadow:0 4px 0 #8d2e1c}.draw:hover{background:#a9341c}.draw:active{transform:translateY(2px);box-shadow:0 2px 0 #8d2e1c}.search-tools{margin-top:16px}.search-tools label{display:block;font-size:.8rem;font-weight:700;margin-bottom:7px}.search-row{display:flex;gap:8px}.search-row input{min-width:0;flex:1;font:inherit;color:var(--ink);background:white;border:1px solid var(--line);border-radius:10px;padding:9px}.search-row button{background:#ffddc7;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:700}.copy-status{font-size:.8rem;margin:7px 0 0;color:var(--muted)}.copy-status:empty{display:none}.pop{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.85);opacity:.65}to{transform:scale(1);opacity:1}}footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:.79rem;text-align:center}@media(max-width:720px){.shell{width:min(100% - 32px,500px)}.top{padding:20px 0}main{grid-template-columns:1fr;gap:22px;min-height:auto;padding:8px 0 32px}.intro{padding:0}.lead{margin:15px 0 21px}.art{min-height:224px}.plate{width:156px}.food{font-size:5rem}}@media(prefers-reduced-motion:reduce){.pop{animation:none}}
.restaurant-photo{display:none;width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.art.has-photo .restaurant-photo{display:block}
.art.has-photo .plate,.art.has-photo .spark{display:none}
[hidden]{display:none!important}
@media(max-width:720px){.art{min-height:240px}}
</style>
</head>

<div class="shell">

<section class="intro" aria-labelledby="title">

<div class="search-tools" id="search-tools" hidden>
<label for="keyword">Restaurant search keyword for Meituan</label>
<div class="search-row">
<input id="keyword" type="text" lang="zh-Hans" readonly>
<button id="copy" type="button">Copy</button>
</div>
<p class="copy-status" id="copy-status" role="status"></p>
</div>
</div>
</section>
</main>
<footer>15 restaurants across 2 meals</footer>

];
const meals = { trua: 'Lunch', toi: 'Dinner' };
const buttons = [...document.querySelectorAll('[data-meal]')];
const tag = document.querySelector('#tag');
const art = document.querySelector('#art');
const photo = document.querySelector('#photo');
const restaurant = document.querySelector('#restaurant');
const desc = document.querySelector('#desc');
const draw = document.querySelector('#draw');
const searchTools = document.querySelector('#search-tools');
const keywordInput = document.querySelector('#keyword');
const copyStatus = document.querySelector('#copy-status');
const remaining = new Map();
const lastDraw = new Map();
let meal = 'trua';
let searchRevision = 0;

document.querySelector('#copy').addEventListener('click', async () => {
  const revision = searchRevision;
  try {
    await navigator.clipboard.writeText(keywordInput.value);
    if (revision === searchRevision) copyStatus.textContent = 'Copied!';
  } catch {
    if (revision !== searchRevision) return;
    keywordInput.focus();
    keywordInput.select();
    copyStatus.textContent = 'Text selected. Use your device’s copy command.';
  }
});

function showMeal(key) {
  meal = key;
  buttons.forEach(button => button.setAttribute('aria-pressed', button.dataset.meal === meal));
  searchRevision++;
  searchTools.hidden = true;
  keywordInput.value = '';
  copyStatus.textContent = '';
  tag.textContent = meals[meal];
  art.classList.remove('has-photo');
  restaurant.textContent = 'Where are we ordering from?';
  desc.textContent = 'Tap below to pick a restaurant.';
  draw.textContent = '🎲 Pick a restaurant';
}

buttons.forEach(button => button.addEventListener('click', () => {
  if (button.dataset.meal !== meal) showMeal(button.dataset.meal);
}));

draw.addEventListener('click', () => {
  let pool = remaining.get(meal);
  if (!pool?.length) pool = [...restaurants];

  const candidates = pool.filter(item => item !== lastDraw.get(meal));
  const chosen = candidates[Math.floor(Math.random() * candidates.length)];
  remaining.set(meal, pool.filter(item => item !== chosen));
  lastDraw.set(meal, chosen);

  searchRevision++;
  copyStatus.textContent = '';
  photo.src = chosen.photo;
  art.classList.add('has-photo');
  restaurant.textContent = chosen.name;
  desc.textContent = chosen.note;
  keywordInput.value = chosen.keyword;
  searchTools.hidden = false;
  draw.textContent = '🎲 Pick another restaurant';
});
</script>
